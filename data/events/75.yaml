name: 台灣零時政府第柒拾伍次投出未來黑客松
subtitle: |
  出來投票吧！投出未來，投出希望，投出公民科技的力量。這次黑客松將聚焦於公民科技行動指引網站的推廣與應用，邀請各地的公民、開發者、設計師、社會運動者、公務員、法律專家、文字工作者、藝術家、教育者等，共同參與，為社會帶來更多創新與改變。
